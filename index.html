<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxer Anime Art</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --text-main: #ffffff;
            --text-secondary: #e0e0e0;
            --text-muted: #bbb;
            --container-bg: rgba(15, 15, 20, 0.90);
            --border-color: #333;
            --accent-color: #e50914;
            --shadow-color: rgba(0, 0, 0, 0.9);
            --img-border: #444;
        }

        body.light-mode {
            --text-main: #111111;
            --text-secondary: #333333;
            --text-muted: #555555;
            --container-bg: rgba(255, 255, 255, 0.92);
            --border-color: #ccc;
            --accent-color: #d3000f;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --img-border: #aaa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(rgba(10, 10, 12, 0.3),
                    rgba(10, 10, 12, 0.3)), url('img/Fondo horizontal-1.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
        }

        body.light-mode {
            background: linear-gradient(rgba(240, 240, 245, 0.3),
                    rgba(240, 240, 245, 0.3)), url('img/Fondo horizontal-1.jpeg') no-repeat center center fixed;
            background-size: cover;
        }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .theme-toggle:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .container {
            background: var(--container-bg);
            padding: 30px 25px;
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--accent-color);
            box-shadow: 0 10px 30px var(--shadow-color);
            max-width: 550px;
            width: 90%;
            position: relative;
            backdrop-filter: blur(8px);
            margin: 20px auto;
        }

        .japanese-text {
            color: var(--accent-color);
            font-size: 1.1em;
            letter-spacing: 4px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .image-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 15px;
            border: 2px solid var(--img-border);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.2);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .image-container:hover img {
            transform: scale(1.05);
        }

        h1 {
            font-family: 'Noto Serif JP', serif;
            color: var(--text-main);
            font-size: 1.5em;
            margin: 0 0 4px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
        }

        .japanese-title {
            font-family: 'Noto Serif JP', serif;
            color: var(--text-muted);
            font-size: 0.9em;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .description {
            font-size: 1.05em;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: var(--text-muted);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .social-links button,
        .social-links a {
            text-decoration: none;
            color: var(--text-main);
            background-color: transparent;
            border: 1px solid var(--accent-color);
            padding: 4px 12px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
        }

        .social-links button:hover,
        .social-links a:hover {
            background-color: var(--accent-color);
            color: #fff;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
        }

        #galeria-seccion {
            display: none;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
            animation: fadeIn 0.3s ease;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .gallery-item {
            width: 100%;
            height: 80px;
            border: 2px solid var(--img-border);
            border-radius: 4px;
            overflow: hidden;
            background: #000;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <button id="btn-theme" class="theme-toggle">☀️ Modo Día</button>

    <div class="container">
        <div class="japanese-text">フォックス • 準備中</div>

        <div class="image-container">
            <img src="img/boceto-avril-logo.jpeg" alt="Logo y Boceto Anime de Foxer">
        </div>

        <h1>Foxer Anime Art</h1>
        <div class="japanese-title">フォックスアニメアート</div>

        <p class="description">
            Muy pronto bocetos, ilustraciones y textos.
        </p>

        <div class="social-links">
            <button id="btn-abrir-galeria">Instagram</button>
        </div>

        <div id="galeria-seccion">
            <p style="font-size: 1em; color: var(--text-main); margin-bottom: 10px;">Galería de Avances</p>

            <div class="gallery-grid">
                <div class="gallery-item">
                    <img id="scroll-slot-1" src="img/scroll/foto-1.jpeg" alt="Foto 1">
                </div>
                <div class="gallery-item">
                    <img id="scroll-slot-2" src="img/scroll/foto-2.jpeg" alt="Foto 2">
                </div>
                <div class="gallery-item">
                    <img id="scroll-slot-3" src="img/scroll/foto-3.jpeg" alt="Foto 3">
                </div>
            </div>

            <div style="margin-top: 10px;">
                <a href="https://instagram.com/foxer_2012_cris" target="_blank" style="font-size: 0.85em;">Ver perfil en
                    Instagram</a>
            </div>
        </div>
    </div>

    <script>
        const btnTheme = document.getElementById('btn-theme');
        const body = document.body;

        btnTheme.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            btnTheme.innerText = body.classList.contains('light-mode') ? '🌙 Modo Noche' : '☀️ Modo Día';
        });

        const btnGaleria = document.getElementById('btn-abrir-galeria');
        const seccionGaleria = document.getElementById('galeria-seccion');

        btnGaleria.addEventListener('click', () => {
            if (seccionGaleria.style.display === 'block') {
                seccionGaleria.style.display = 'none';
                btnGaleria.innerText = 'Instagram';
            } else {
                seccionGaleria.style.display = 'block';
                btnGaleria.innerText = 'Cerrar Galería';
            }
        });

        // Configurado exactamente para las 4 fotos que tienes en la carpeta scroll
        const totalFotos = 4;
        let indiceActual = 0;

        const slot1 = document.getElementById('scroll-slot-1');
        const slot2 = document.getElementById('scroll-slot-2');
        const slot3 = document.getElementById('scroll-slot-3');

        function actualizarScroll() {
            const idx1 = (indiceActual % totalFotos) + 1;
            const idx2 = ((indiceActual + 1) % totalFotos) + 1;
            const idx3 = ((indiceActual + 2) % totalFotos) + 1;

            slot1.src = `img/scroll/foto-${idx1}.jpeg`;
            slot2.src = `img/scroll/foto-${idx2}.jpeg`;
            slot3.src = `img/scroll/foto-${idx3}.jpeg`;

            indiceActual = (indiceActual + 1) % totalFotos;
        }

        setInterval(actualizarScroll, 3500);
    </script>

</body>

</html>
