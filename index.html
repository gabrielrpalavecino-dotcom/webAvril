<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxer Anime Art</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --text-main: #ffffff;
            --text-secondary: #e0e0e0;
            --text-muted: #cccccc;
            --container-bg: rgba(15, 15, 20, 0.15);
            --accent-color: #e50914;
            --bone-color: #f5f2eb;
            --violet-color: #8a2be2;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --img-border: #444;
            --text-outline: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 1px rgba(0, 0, 0, 0.8);
        }

        /* Modo Hueso */
        body.light-mode {
            --text-main: #2b2b2b;
            --text-secondary: #3b3b3b;
            --text-muted: #555555;
            --container-bg: rgba(245, 242, 235, 0.25);
            --violet-color: #7b1fa2;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --img-border: #c5bdb0;
            --text-outline: 0 1px 2px rgba(255, 255, 255, 0.8), 0 0 1px rgba(255, 255, 255, 0.6);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(rgba(10, 10, 12, 0.3), rgba(10, 10, 12, 0.3)), url('img/Fondo horizontal-1.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
            text-shadow: var(--text-outline);
        }

        body.light-mode {
            background: linear-gradient(rgba(245, 242, 235, 0.35), rgba(245, 242, 235, 0.35)), url('img/Fondo horizontal-1.jpeg') no-repeat center center fixed;
            background-size: cover;
        }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--violet-color);
            padding: 5px 10px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            text-shadow: none;
        }

        body.light-mode .theme-toggle {
            color: #2b2b2b;
        }

        .container {
            background: var(--container-bg);
            padding: 30px 25px;
            box-shadow: 0 10px 30px var(--shadow-color);
            width: 90%;
            max-width: 550px;
            backdrop-filter: blur(8px);
            margin: 20px auto;
        }

        .japanese-text {
            color: var(--violet-color);
            font-size: 1.25em;
            letter-spacing: 4px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .image-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 15px;
            border: 2px solid var(--img-border);
            border-radius: 5px;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-family: 'Noto Serif JP', serif;
            color: var(--text-main);
            font-size: 1.5em;
            margin: 0 0 4px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
        }

        .japanese-title {
            font-family: 'Noto Serif JP', serif;
            color: var(--text-muted);
            font-size: 1em;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .description {
            font-size: 1.05em;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .social-links button {
            background-color: var(--violet-color);
            color: #fff;
            border: none;
            padding: 6px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
        }

        #galeria-seccion {
            display: none;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px dashed rgba(138, 43, 226, 0.3);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .gallery-item {
            width: 100%;
            height: 80px;
            border: 2px solid var(--img-border);
            border-radius: 4px;
            overflow: hidden;
            background: #000;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .footer-credits {
            margin-top: 25px;
            font-size: 0.8em;
            font-weight: 700;
            color: var(--violet-color);
        }

        @media screen and (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }

            .image-container {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>

<body>

    <button id="btn-theme" class="theme-toggle">☀️ Modo Día</button>

    <div class="container">
        <div class="japanese-text">フォックス • 准备中</div>
        <div class="image-container"><img src="img/boceto-avril-logo.jpeg" alt="Logo"></div>
        <h1>Foxer Anime Art</h1>
        <div class="japanese-title">フォックスアニメアート</div>
        <p class="description">Muy pronto bocetos, ilustraciones y textos.</p>
        <div class="social-links"><button id="btn-abrir-galeria">Instagram</button></div>

        <div id="galeria-seccion">
            <div class="gallery-grid">
                <div class="gallery-item"><img id="scroll-slot-1" src="img/scroll/foto-1.jpeg"></div>
                <div class="gallery-item"><img id="scroll-slot-2" src="img/scroll/foto-2.jpeg"></div>
                <div class="gallery-item"><img id="scroll-slot-3" src="img/scroll/foto-3.jpeg"></div>
            </div>
            <a href="https://instagram.com/foxer_2012_cris" target="_blank"
                style="color:var(--violet-color); text-decoration:none; font-weight:bold;">Ver perfil</a>
        </div>

        <div class="footer-credits">© Foxer Anime Art – Madrid<br>© Krusty Broadcasting web services</div>
    </div>

    <script>
        const btnTheme = document.getElementById('btn-theme');
        btnTheme.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            btnTheme.innerText = document.body.classList.contains('light-mode') ? '🌙 Modo Noche' : '☀️ Modo Día';
        });

        const btnGaleria = document.getElementById('btn-abrir-galeria');
        const seccionGaleria = document.getElementById('galeria-seccion');
        btnGaleria.addEventListener('click', () => {
            seccionGaleria.style.display = (seccionGaleria.style.display === 'block') ? 'none' : 'block';
            btnGaleria.innerText = (seccionGaleria.style.display === 'block') ? 'Cerrar Galería' : 'Instagram';
        });
    </script>
</body>

</html>
