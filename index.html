<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avril Anime Art</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --bg-gradient: radial-gradient(circle at center, #1a1a24 0%, #000000 100%);
            --text-main: #ffffff;
            --text-secondary: #e0e0e0;
            --text-muted: #bbb;
            --container-bg: rgba(20, 20, 25, 0.85);
            --border-color: #333;
            --accent-color: #e50914;
            --shadow-color: rgba(0, 0, 0, 0.9);
            --img-border: #444;
        }

        body.light-mode {
            --bg-color: #f4f4f4;
            --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #e0e0e0 100%);
            --text-main: #111111;
            --text-secondary: #333333;
            --text-muted: #555555;
            --container-bg: rgba(255, 255, 255, 0.85);
            --border-color: #ccc;
            --accent-color: #d3000f;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --img-border: #aaa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .container {
            background: var(--container-bg);
            padding: 50px 40px;
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--accent-color);
            box-shadow: 0 10px 30px var(--shadow-color);
            max-width: 600px;
            width: 90%;
            position: relative;
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .japanese-text {
            color: var(--accent-color);
            font-size: 1.2em;
            letter-spacing: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .image-container {
            width: 280px;
            height: 280px;
            margin: 0 auto 25px;
            border: 2px solid var(--img-border);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.2);
            transition: border-color 0.4s ease;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
            filter: contrast(1.1);
        }

        .image-container:hover img {
            transform: scale(1.05);
        }

        h1 {
            font-family: 'Noto Serif JP', serif;
            color: var(--text-main);
            font-size: 1.75em;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 700;
        }

        .description {
            font-size: 1.2em;
            letter-spacing: 1px;
            margin-bottom: 35px;
            color: var(--text-muted);
        }

        .social-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .social-links a {
            text-decoration: none;
            color: var(--text-main);
            background-color: transparent;
            border: 1px solid var(--accent-color);
            padding: 4px 12px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background-color: var(--accent-color);
            color: #fff;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
        }
    </style>
</head>

<body>

    <button id="btn-theme" class="theme-toggle">☀️ Modo Día</button>

    <div class="container">
        <div class="japanese-text">アヴリル • 準備中</div>

        <div class="image-container">
            <img src="img/boceto-avril-logo.jpeg" alt="Logo y Boceto Anime de Avril">
        </div>

        <h1>Avril Anime Art</h1>

        <p class="description">
            Muy pronto bocetos, ilustraciones y textos.
        </p>

        <div class="social-links">
            <a href="https://instagram.com/avrilanime8" target="_blank">Instagram</a>
        </div>
    </div>

    <script>
        const btnTheme = document.getElementById('btn-theme');
        const body = document.body;

        btnTheme.addEventListener('click', () => {
            body.classList.toggle('light-mode');

            if (body.classList.contains('light-mode')) {
                btnTheme.innerText = '🌙 Modo Noche';
            } else {
                btnTheme.innerText = '☀️ Modo Día';
            }
        });
    </script>

</body>

</html>
